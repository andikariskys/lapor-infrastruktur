services:
  app:
    build: .
    container_name: lapor-app
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      - mysql
    working_dir: /var/www

  mysql:
    image: mysql:8.0
    container_name: lapor-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_USER: lapor_user
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: lapor_password
      MYSQL_DATABASE: laravel_lapor
    ports:
      - "8001:3306"
    volumes:
      - db_fe_data:/var/lib/mysql

volumes:
  db_fe_data:
